<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Endast TrueType: OpenType/CFF-fonter ger PDF/A-1-fel när LibreOffice väljer dem som ersättning. -->
<fontconfig>
  <dir>/opt/fonts</dir>
  <selectfont>
    <rejectfont>
      <glob>*.otf</glob>
      <glob>*.OTF</glob>
      <pattern><patelt name="fontformat"><string>CFF</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
