apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-converter
  labels:
    app: file-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-converter
  template:
    metadata:
      labels:
        app: file-converter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Hämtningshemlighet för ett privat registry. Finns den inte i namespacet hämtas imagen utan inloggning.
      imagePullSecrets:
        - name: file-converter-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: file-converter
          # Registry och tagg sätts i overlays (images i kustomization.yaml).
          image: file-converter
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            # En LibreOffice-process per samtidig Office-konvertering. Höj tillsammans med minnet.
            - name: CONVERTER_OFFICE_POOL_SIZE
              value: "2"
            # Aktiverar /admin. Utan hemligheten är administrationen avstängd.
            - name: CONVERTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-converter-admin
                  key: password
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 1536Mi
            limits:
              memory: 3Gi
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: assets
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: assets
          persistentVolumeClaim:
            claimName: file-converter-assets
