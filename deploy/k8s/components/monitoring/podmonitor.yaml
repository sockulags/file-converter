# Skrapar varje podd direkt, även poddar som inte är ready (de syns då i larmen i stället för att
# försvinna). NetworkPolicy släpper in Prometheus på 9090 när dess namespace har etiketten
# file-converter/metrics=true.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: file-converter
  labels:
    app: file-converter
spec:
  selector:
    matchLabels:
      app: file-converter
  podMetricsEndpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
