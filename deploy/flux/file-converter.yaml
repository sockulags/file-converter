# Exempel för Flux (kustomize.toolkit.fluxcd.io/v1). Lägg i det repo som Flux redan läser och
# anpassa namn, gren och intervall. Varje miljö pekar på sin overlay i det här repot.
#
# Lösenordet till /admin och hämtningshemligheten till registryt checkas inte in i klartext.
# Skapa dem i klustret, eller kryptera dem med SOPS och avkoda via spec.decryption nedan.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: file-converter
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/OWNER/file-converter
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: file-converter-test
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: file-converter
  path: ./deploy/k8s/overlays/test
  prune: true
  wait: true
  timeout: 5m
  # decryption:
  #   provider: sops
  #   secretRef:
  #     name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: file-converter-prod
  namespace: flux-system
spec:
  # Produktion driftsätts först när testmiljön är frisk.
  dependsOn:
    - name: file-converter-test
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: file-converter
  path: ./deploy/k8s/overlays/prod
  prune: true
  wait: true
  timeout: 5m
