# Föreslår uppdateringar av beroenden, bl.a. säkerhetsrättningar i PDFBox, veraPDF och Spring.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # veraPDF kräver javax-JAXB 2.3. Med JAXB 4 (Jakarta) hittar veraPDF inga valideringsprofiler.
      - dependency-name: "com.sun.xml.bind:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "javax.xml.bind:jaxb-api"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns: ["org.springframework*"]
      pdf:
        patterns: ["org.apache.pdfbox*", "org.verapdf*", "io.github.openhtmltopdf*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
