spring:
  application:
    name: file-converter
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  threads:
    virtual:
      enabled: true

server:
  port: 3000  # samma port som Gotenberg

# Mätvärden på en egen port, skild från konverterings-API:t: /actuator/prometheus och /actuator/health.
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: file-converter

# Spårnings-id (Gotenberg-Trace) på varje loggrad. Strukturerade loggar (JSON):
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
logging:
  pattern:
    correlation: "[%X{traceId:-}] "

converter:
  office:
    enabled: true
    home: ""            # tomt = hitta LibreOffice automatiskt
    pool-size: 2        # en LibreOffice-process per samtidig Office-konvertering
    task-timeout: 120s
    queue-timeout: 30s
    max-tasks-per-process: 200  # starta om processen regelbundet för att undvika minnesläckor
  fonts:
    dirs:
      - /usr/share/fonts/truetype
      - /opt/fonts
    # Hakparenteser behövs för nycklar med mellanslag och bindestreck, annars tar Spring bort dem.
    aliases:
      "[sans-serif]": Liberation Sans
      "[serif]": Liberation Serif
      "[monospace]": Liberation Mono
      "[Arial]": Liberation Sans
      "[Helvetica]": Liberation Sans
      "[Times New Roman]": Liberation Serif
      "[Times]": Liberation Serif
      "[Courier New]": Liberation Mono
      "[Courier]": Liberation Mono
      "[Calibri]": Carlito
      "[Cambria]": Caladea
  pdfa:
    strict: true
  assets:
    dir: ./data            # i Docker: /data, i Kubernetes en delad volym (ReadWriteMany)
    poll-interval: 30s
  limits:
    max-concurrent: 0      # 0 = antal processorer
    queue-timeout: 60s
  admin:
    password: ""           # sätt CONVERTER_ADMIN_PASSWORD för att aktivera /admin
